[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soberana-toolkit"
version = "0.1.0"
description = "Reusable Earth-observation tooling: openEO pipelines, datacube assembly, analysis, ML and serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openeo>=0.54",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
