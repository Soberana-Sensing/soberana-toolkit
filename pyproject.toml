[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soberana-toolkit"
version = "0.1.0"
description = "Reusable Earth-observation tooling: openEO pipelines, datacube assembly, analysis, ML and serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openeo>=0.54",
    "pyyaml>=6",
    "xarray>=2024.1",
    "rioxarray>=0.18",
    "netCDF4>=1.7",
    "pyproj>=3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
serve = [
    "plotly>=5.20",
    "streamlit>=1.49",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pylance reads this block too; it needs the interpreter when the venv name is not
# one of the auto-detected ones (.venv, venv, env).
[tool.pyright]
venvPath = "."
venv = "soberana-toolkit-venv"
include = ["src", "scripts", "tests"]
# openeo ships py.typed and re-exports `connect` without the `as` form, so type
# checkers treat it as private. Library-side issue, not ours.
reportPrivateImportUsage = "none"
