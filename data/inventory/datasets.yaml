# Dataset inventory. Schema and fields are documented in README.md next to this file.
# Every row is checked against its grid file under config/grids/.
datasets:
  - name: s2_l2a_monthly
    path: data/derived/s2_l2a_monthly/s2_l2a_monthly.nc
    role: predictor
    source: SENTINEL2_L2A, Copernicus Data Space Ecosystem via openEO
    grid: utm28_30m
    crs: EPSG:32628
    native_resolution: 10
    resolution: 30
    acquisition: 2016-01-01/2025-12-31
    retrieved: 2026-11-27
    method: bilinear
